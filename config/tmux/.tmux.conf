# prefix は従来どおり Ctrl+b

# ペイン分割: | で左右、- で上下（カレントディレクトリを引き継ぐ）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 設定の再読み込み: prefix + r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# マウスでペイン選択・リサイズ・スクロール
set -g mouse on

# マウスで範囲選択（ドラッグ・ダブル/トリプルクリック）したらシステムのクリップボードにも入れる。
# copy-pipe を引数なしで使う操作（マウス選択の既定バインド）がこのコマンドに流れる。
# GUI 環境では wl-copy / xclip / xsel を優先し、なければ（SSH・devcontainer など）捨てる。
# その場合も set-clipboard（既定 external）により、OSC 52 対応のターミナルならクリップボードに入る。
set -s copy-command 'if [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null; then wl-copy; elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null; then xclip -selection clipboard -in; elif [ -n "$DISPLAY" ] && command -v xsel >/dev/null; then xsel --clipboard --input; else cat >/dev/null; fi'

# ウィンドウ・ペイン番号を 1 から始める
set -g base-index 1
setw -g pane-base-index 1

# Esc の待ち時間をなくす（vim などで体感遅延が出ないように）
set -sg escape-time 0

# 256色対応
set -g default-terminal "tmux-256color"

# lazygit を popup で開く: prefix + g（カレントディレクトリのリポジトリ。q で閉じる）
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
